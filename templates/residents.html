{% extends "base.html" %}
{% block content %}
<section class="page-head"><div><p class="eyebrow">People</p><h2>Residents</h2></div></section>
<form class="panel" method="post">
  <div class="form-grid">
    <input name="full_name" placeholder="Full name" required>
    <input name="phone" placeholder="Phone">
    <input name="email" placeholder="Email">
    <input name="guardian_name" placeholder="Guardian name">
    <input name="guardian_phone" placeholder="Guardian phone">
    <select name="room_id"><option value="">No room</option>{% for room in rooms %}<option value="{{ room.id }}">{{ room.room_number }}</option>{% endfor %}</select>
    <input name="monthly_fee" type="number" step="0.01" placeholder="Monthly fee" required>
    <select name="status"><option>Active</option><option>Inactive</option></select>
  </div>
  <button>Save Resident</button>
</form>
<table>
  <thead><tr><th>Name</th><th>Room</th><th>Phone</th><th>Monthly Fee</th><th>Status</th><th></th></tr></thead>
  <tbody>
    {% for resident in residents %}
    <tr>
      <td>{{ resident.full_name }}</td><td>{{ resident.room_number or "-" }}</td><td>{{ resident.phone }}</td>
      <td>Rs. {{ money(resident.monthly_fee) }}</td><td>{{ resident.status }}</td>
      <td><a href="{{ url_for('edit_resident', resident_id=resident.id) }}">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
