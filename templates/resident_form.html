{% extends "base.html" %}
{% block content %}
<section class="page-head"><div><p class="eyebrow">Edit</p><h2>{{ resident.full_name }}</h2></div></section>
<form class="panel" method="post">
  <div class="form-grid">
    <input name="full_name" value="{{ resident.full_name }}" required>
    <input name="phone" value="{{ resident.phone or '' }}">
    <input name="email" value="{{ resident.email or '' }}">
    <input name="guardian_name" value="{{ resident.guardian_name or '' }}">
    <input name="guardian_phone" value="{{ resident.guardian_phone or '' }}">
    <select name="room_id">
      <option value="">No room</option>
      {% for room in rooms %}<option value="{{ room.id }}" {{ 'selected' if resident.room_id == room.id else '' }}>{{ room.room_number }}</option>{% endfor %}
    </select>
    <input name="monthly_fee" type="number" step="0.01" value="{{ resident.monthly_fee }}" required>
    <select name="status">
      {% for status in ["Active", "Inactive"] %}<option {{ 'selected' if resident.status == status else '' }}>{{ status }}</option>{% endfor %}
    </select>
  </div>
  <button>Update Resident</button>
</form>

<section class="danger-panel" style="margin-top: 24px;">
  <p class="eyebrow" style="color: var(--warn);">Danger Zone</p>
  <h3>Delete Resident</h3>
  <p style="color: var(--muted); font-size: 14px; margin-bottom: 14px;">
    Safely delete this resident. All associated monthly fee records and payment history will also be removed without database errors.
  </p>
  <form method="post" action="{{ url_for('delete_resident', resident_id=resident.id) }}" onsubmit="return confirm('Are you sure you want to delete {{ resident.full_name }}? All related monthly fees and payment records will also be safely removed.');">
    <button type="submit" class="button-danger">Delete Resident</button>
  </form>
</section>
{% endblock %}
