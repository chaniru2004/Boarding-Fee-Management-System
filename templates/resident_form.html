{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">People</p>
    <h2>Edit Resident &mdash; {{ resident.full_name }}</h2>
  </div>
  <a class="button-link" href="{{ url_for('residents') }}">Back to Residents</a>
</section>

<form class="panel" method="post">
  <div class="form-grid">
    <div>
      <label class="field-label">Full Name</label>
      <input name="full_name" value="{{ resident.full_name }}" required>
    </div>
    <div>
      <label class="field-label">NIC</label>
      <input name="nic" value="{{ resident.nic or '' }}" required>
    </div>
    <div>
      <label class="field-label">Phone</label>
      <input name="phone" value="{{ resident.phone or '' }}">
    </div>
    <div>
      <label class="field-label">Date of Birth</label>
      <input name="date_of_birth" type="date" value="{{ resident.date_of_birth or '' }}">
    </div>
    <div>
      <label class="field-label">Faculty</label>
      <input name="faculty" value="{{ resident.faculty or '' }}">
    </div>
    <div>
      <label class="field-label">Address</label>
      <input name="address" value="{{ resident.address or '' }}">
    </div>
    <div>
      <label class="field-label">Guardian Name</label>
      <input name="guardian_name" value="{{ resident.guardian_name or '' }}">
    </div>
    <div>
      <label class="field-label">Guardian Phone</label>
      <input name="guardian_phone" value="{{ resident.guardian_phone or '' }}">
    </div>
    <div>
      <label class="field-label">Room</label>
      <select name="room_id">
        <option value="">No room</option>
        {% for room in rooms %}
        <option value="{{ room.id }}" {{ 'selected' if resident.room_id == room.id else '' }}>{{ room.room_number }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="field-label">Monthly Fee (Rs.)</label>
      <input name="monthly_fee" type="number" step="0.01" value="{{ resident.monthly_fee }}" required>
    </div>
    <div>
      <label class="field-label">Status</label>
      <select name="status">
        {% for status in ["Active", "Inactive"] %}
        <option {{ 'selected' if resident.status == status else '' }}>{{ status }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <button type="submit">Update Resident</button>
</form>

<section class="danger-panel" style="margin-top: 24px;">
  <p class="eyebrow" style="color: var(--warn);">Danger Zone</p>
  <h3>Delete Resident</h3>
  <p style="color: var(--muted); font-size: 14px; margin-bottom: 14px;">
    Safely delete this resident. All associated monthly fee records and payment history will also be removed without database errors.
  </p>
  <form method="post" action="{{ url_for('delete_resident', resident_id=resident.id) }}" onsubmit="return confirm('Are you sure you want to delete {{ resident.full_name }}? All related monthly fees and payment records will also be safely removed.');">
    <button type="submit" class="button-danger">Delete Resident</button>
  </form>
</section>
{% endblock %}
