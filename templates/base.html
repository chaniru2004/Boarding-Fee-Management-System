<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boarding Fee Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <aside class="sidebar">
    <h1>Boarding Fees</h1>
    <nav>
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="{{ 'active' if active == 'residents' else '' }}" href="{{ url_for('residents') }}">Residents</a>
      <a class="{{ 'active' if active == 'rooms' else '' }}" href="{{ url_for('rooms') }}">Rooms</a>
      <a class="{{ 'active' if active == 'fees' else '' }}" href="{{ url_for('fees') }}">Monthly Fees</a>
      <a class="{{ 'active' if active == 'payments' else '' }}" href="{{ url_for('payments') }}">Payments</a>
      <a class="{{ 'active' if active == 'reminders' else '' }}" href="{{ url_for('reminders') }}">Reminders</a>
      <a class="{{ 'active' if active == 'reports' else '' }}" href="{{ url_for('reports') }}">Reports</a>
      <a class="{{ 'active' if active == 'audit' else '' }}" href="{{ url_for('audit') }}">Audit</a>
    </nav>
  </aside>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
