[project]
name = "boarding-fee-management-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "pg8000>=1.31.2,<2",
    "Pillow>=10.0.0,<13",
]

[dependency-groups]
dev = [
    "workers-py>=1.9.0",
    "workers-runtime-sdk",
]

[tool.setuptools]
py-modules = ["worker", "app"]
